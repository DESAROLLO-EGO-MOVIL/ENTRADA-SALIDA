        .btn-atras { background-color: #666; font-size: 13px; }

        .img-preview { width: 100%; border-radius: 6px; margin-top: 5px; margin-bottom: 8px; display: none; border: 1px solid #ddd; }
        .info-box { background-color: #e8f5e9; border: 1px solid #34a853; border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 12px; }

        #progressContainer { width: 100%; background-color: #eee; border-radius: 10px; margin-top: 15px; display: none; overflow: hidden; border: 1px solid #ddd; height: 20px; }
        #progressBar { width: 0%; height: 100%; background-color: #34a853; transition: width 0.4s ease; }
        .foto-multiple { background-color: #ff9800; }

    function verificarPass() {
        const input = document.getElementById('passInput');
        if(input.value.toUpperCase() === CLAVE_ACCESO) {
            document.getElementById('sec-pass').classList.add('hidden');
            document.getElementById('sec-form').classList.remove('hidden');
        } else {
            alert("Contraseña Incorrecta");
            input.value = "";
        }
    }

    function actualizarUnidades() {
        const r = document.getElementById('ruta').value;
        const u = document.getElementById('unidad');
        u.innerHTML = '<option value="">-- Seleccionar --</option>';
        if (r && unidadesData[r]) {
            unidadesData[r].forEach(num => {
                const opt = document.createElement('option');
                opt.value = num;
                opt.textContent = "Unidad " + num;
                u.appendChild(opt);
            });
        }
        document.getElementById('info-unidad').classList.add('hidden');
    }

    function cargarInfoUnidad() {

            document.getElementById('info-marca').textContent = info.marca || "-";
            document.getElementById('info-anio').textContent = info.anio || "-";
            document.getElementById('info-vin').textContent = info.vin || "-";
            document.getElementById('info-placas').textContent = info.placas || "-";

        const manto = document.getElementById('manto').value;

        if (manto === "CORRECTIVO") {
            divCorr.classList.remove('hidden');
        } else {
            divCorr.classList.add('hidden');
        }
    }

    function mostrarPreview(input, imgId) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { 
                const img = document.getElementById(imgId);
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

            countDiv.textContent = input.files.length + " foto(s) seleccionada(s)";
            Array.from(input.files).forEach((file) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'img-preview';
                    img.style.display = 'block';
                    container.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        } else {
            countDiv.textContent = '';
        }
    }

    async function comprimirImagen(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 1600; 
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = "white";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, width, height);
                    canvas.toBlob((blob) => {
                        const newFile = new File([blob], "foto.jpg", { type: 'image/jpeg' });
                        resolve(newFile);
                    }, 'image/jpeg', 0.85); 
                };
            };
        });
    }

    async function subirACloudinary(file) {
        if(!file) return "";
        const archivoLigero = await comprimirImagen(file);
        const formData = new FormData();
        formData.append('file', archivoLigero);
        formData.append('upload_preset', UPLOAD_PRESET);
        try {
            const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();
            return data.secure_url || "";
        } catch (e) {
            console.error("Error subiendo:", e);
            return "";
        }
    }

    function actualizarBarra(porcentaje) {
        document.getElementById('progressBar').style.width = porcentaje + "%";
    }

    async function generarHoja() {
        const ruta = document.getElementById('ruta').value;
        const unidad = document.getElementById('unidad').value;
        const km = document.getElementById('km').value;
        const manto = document.getElementById('manto').value;
        const fTablero = document.getElementById('fotoTablero').files[0];
        const fEconomico = document.getElementById('fotoEconomico').files[0];

        if (!ruta || !unidad || !km || !manto) return alert("⚠️ Completa todos los campos obligatorios");
        if (!fTablero || !fEconomico) return alert("📸 Sube las fotos de Tablero y Económico");

        const btn = document.getElementById('btnGenerar');
        const status = document.getElementById('statusMsg');
        const progressCont = document.getElementById('progressContainer');
        
        btn.disabled = true;
        btn.innerText = "PROCESANDO...";
        progressCont.style.display = 'block';
        actualizarBarra(5);

        try {
            status.innerText = "Subiendo fotos...";
            const urlTablero = await subirACloudinary(fTablero);
            const urlEconomico = await subirACloudinary(fEconomico);
            actualizarBarra(30);

            const fPiezas = document.getElementById('fotoPiezas').files;
            const fAntes = document.getElementById('fotoAntes').files;
            const fDespues = document.getElementById('fotoDespues').files;

            let urlsPiezas = [], urlsAntes = [], urlsDespues = [];
            for (let f of fPiezas) urlsPiezas.push(await subirACloudinary(f));
            for (let f of fAntes) urlsAntes.push(await subirACloudinary(f));
            for (let f of fDespues) urlsDespues.push(await subirACloudinary(f));
            actualizarBarra(70);

            status.innerText = "Guardando...";
            const comentarios = manto === "CORRECTIVO" ? document.getElementById('comentariosCorrectivo').value : "";
            
            await fetch(URL_WEBAPP, { 
                method: "POST", 
                body: JSON.stringify({
                    ruta, unidad, km, manto,
                    movimiento: "MANTENIMIENTO", comentarios,
                    fotoOdo: urlTablero, fotoFrontal: urlEconomico,
                    fotoLicencia: "N/A", fotoVin: "N/A", fotoTrasera: "N/A",
                    fotoDerecha: "N/A", fotoIzquierda: "N/A"
                })
            });
            actualizarBarra(90);

            status.innerText = "Abriendo hoja...";
            
            const info = (unidadesInfo && unidadesInfo[unidad]) ? unidadesInfo[unidad] : {};
            const hojaHTML = generarHTMLHoja({
                unidad, km, manto, comentarios,
                urlTablero, urlEconomico, urlsPiezas, urlsAntes, urlsDespues,
                marca: info.marca || "GOLDEN DRAGON",
                anio: info.anio || "2024",
                vin: info.vin || "N/A",
                empresa: info.empresa || "N/A",
                placas: info.placas || "PERMISO"
            });
            
            const blob = new Blob([hojaHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const nuevaVentana = window.open(url, '_blank');
            
            if (!nuevaVentana) {
                alert("⚠️ El navegador bloqueó la ventana emergente.");
                return;
            }
            
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            actualizarBarra(100);

            btn.innerText = "✅ HOJA GENERADA";
            setTimeout(() => {
                btn.innerText = "🔄 GENERAR OTRA";
                btn.disabled = false;
                btn.onclick = () => location.reload();
            }, 2000);

        } catch (e) {
            alert("❌ Error: " + e.message);
            btn.disabled = false;
            btn.innerText = "🔧 GENERAR HOJA";
        }
    }
