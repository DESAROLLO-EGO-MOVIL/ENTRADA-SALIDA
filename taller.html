<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carga de evidencias - Taller EGO</title>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#0f172a;color:#f8fafc;
font:14px Arial,sans-serif}
.app{max-width:480px;margin:auto;padding:18px;background:#1e293b;
border-radius:12px}
h1{font-size:21px;color:#22c55e;margin:0 0 18px}
.datos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label{display:block;font-size:11px;font-weight:bold}
input{width:100%;margin:6px 0 12px;padding:10px 5px;border:1px solid #38bdf8;
border-radius:6px;background:#0f172a;color:white;font:inherit}
h2{font-size:13px;background:#0f172a;padding:9px;color:#38bdf8}
.fotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.doble{grid-template-columns:repeat(2,minmax(0,1fr))}
.simple{grid-template-columns:1fr}
.foto{position:relative;height:100px;overflow:hidden;border:2px dashed #64748b;
border-radius:8px;background:#0f172a;color:#cbd5e1;cursor:pointer;
display:flex;align-items:center;justify-content:center;text-align:center}
.foto input{position:absolute;inset:0;width:100%;height:100%;margin:0;
opacity:0;cursor:pointer}
.foto img{position:absolute;width:100%;height:100%;object-fit:cover}
.foto span{padding:6px;font-size:12px}
.foto:focus-within{outline:2px solid #38bdf8}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;
background:#16a34a;color:white;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{background:#64748b;cursor:wait}
progress{width:100%;margin-top:16px;accent-color:#22c55e}
#estado{white-space:pre-wrap;font-size:13px;line-height:1.5}
.nota{font-size:12px;color:#cbd5e1}
[hidden]{display:none!important}
</style>
</head>

<body>
<main class="app">
<h1>e·go · Evidencias de taller</h1>

<form id="formulario">
  <div class="datos">
    <label>Unidad
      <input id="unidadNum" type="text" inputmode="numeric"
             pattern="[0-9]+" placeholder="3134" required>
    </label>
    <label>Kilometraje
      <input id="kmNum" type="number" min="0" step="1"
             placeholder="271079" required>
    </label>
    <label>Fecha
      <input id="fechaManual" type="date" required>
    </label>
  </div>

  <h2>1. Tablero y frontal de unidad</h2>
  <div id="identificacion" class="fotos doble"></div>

  <h2>2. Refacciones nuevas</h2>
  <div id="refacciones" class="fotos simple"></div>

  <h2>3. Antes del mantenimiento</h2>
  <div id="antes" class="fotos"></div>

  <h2>4. Después del mantenimiento</h2>
  <div id="despues" class="fotos"></div>

  <p class="nota">
    Puedes subir una o varias fotos. Las posiciones que no selecciones
    conservarán sus enlaces anteriores.
  </p>

  <button id="btnSubmit" type="submit">SUBIR EVIDENCIAS</button>
</form>

<progress id="progreso" max="100" value="0" hidden></progress>
<p id="estado" role="status" aria-live="polite"></p>
<a id="verFormato" hidden style="color:#7dd3fc">
  Abrir formato de mantenimiento
</a>
</main>

<script>
"use strict";

const firebaseConfig = {
  apiKey: "AIzaSyDLywqH8iBbnlSwwRFhWVbZ4mjEkz6Xs_8",
  authDomain: "gestion-servicios-ego.firebaseapp.com",
  projectId: "gestion-servicios-ego",
  storageBucket: "gestion-servicios-ego.firebasestorage.app",
  messagingSenderId: "378018276879",
  appId: "1:378018276879:web:310b4d30b0d3d4e8c6257a"
};

const CLOUD_NAME = "dyqb7qjqt";
const UPLOAD_PRESET = "ego_fotos";
const $ = id => document.getElementById(id);

const posiciones = [
  ["identificacion", "odo", "Odómetro"],
  ["identificacion", "frontal", "Frontal / económico"],
  ["refacciones", "nuevas", "Refacciones nuevas"],
  ["antes", "antes1", "Antes 1"],
  ["antes", "antes2", "Antes 2"],
  ["antes", "antes3", "Antes 3"],
  ["despues", "despues1", "Después 1"],
  ["despues", "despues2", "Después 2"],
  ["despues", "despues3", "Después 3"]
];

let db = null;
let ocupado = false;

function mensaje(texto, error = false) {
  $("estado").textContent = texto;
  $("estado").style.color = error ? "#fca5a5" : "#cbd5e1";
}

try {
  if (!window.firebase) throw new Error("No se descargó el SDK de Firebase.");
  const app = firebase.apps.length
    ? firebase.app()
    : firebase.initializeApp(firebaseConfig);

  db = app.firestore();

  if (app.options.projectId !== firebaseConfig.projectId) {
    throw new Error("La aplicación Firebase pertenece a otro proyecto.");
  }
} catch (error) {
  db = null;
  mensaje("No se pudo iniciar Firebase: " + error.message, true);
}

const hoy = new Date();
$("fechaManual").value =
  `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,"0")}-` +
  String(hoy.getDate()).padStart(2,"0");

for (const [grupo, clave, titulo] of posiciones) {
  const tarjeta = document.createElement("label");
  tarjeta.className = "foto";

  const texto = document.createElement("span");
  texto.textContent = "📷 " + titulo;

  const imagen = document.createElement("img");
  imagen.alt = titulo;
  imagen.hidden = true;

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.setAttribute("capture", "environment");
  input.id = "foto-" + clave;
  input.setAttribute("aria-label", titulo);

  input.addEventListener("change", () => {
    const archivo = input.files[0];
    if (!archivo) return;

    imagen.hidden = true;
    texto.hidden = false;
    tarjeta.style.borderColor = "#64748b";

    if (archivo.type && !archivo.type.startsWith("image/")) {
      input.value = "";
      mensaje("Selecciona una imagen para " + titulo + ".", true);
      return;
    }

    const url = URL.createObjectURL(archivo);

    imagen.onload = () => {
      URL.revokeObjectURL(url);
      imagen.hidden = false;
      texto.hidden = true;
      tarjeta.style.borderColor = "#22c55e";
    };

    imagen.onerror = () => {
      URL.revokeObjectURL(url);
      input.value = "";
      imagen.hidden = true;
      texto.hidden = false;
      mensaje("No se pudo abrir la imagen: " + titulo, true);
    };

    imagen.src = url;
  });

  tarjeta.append(texto, imagen, input);
  $(grupo).append(tarjeta);
}

function comprimirImagen(archivo) {
  return new Promise((resolve, reject) => {
    const imagen = new Image();
    const url = URL.createObjectURL(archivo);

    imagen.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("El navegador no pudo abrir una fotografía."));
    };

    imagen.onload = () => {
      URL.revokeObjectURL(url);

      try {
        const escala = Math.min(
          1, 1280 / Math.max(imagen.naturalWidth, imagen.naturalHeight)
        );

        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(imagen.naturalWidth * escala));
        canvas.height = Math.max(1, Math.round(imagen.naturalHeight * escala));

        const ctx = canvas.getContext("2d");
        if (!ctx) throw new Error("No se pudo preparar la imagen.");

        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(imagen, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
          if (blob) resolve(blob);
          else reject(new Error("No se pudo comprimir la fotografía."));
        }, "image/jpeg", 0.75);
      } catch (error) {
        reject(error);
      }
    };

    imagen.src = url;
  });
}

async function uploadCloudinary(blob) {
  if (!blob) throw new Error("La imagen comprimida está vacía.");

  const form = new FormData();
  form.append("file", blob, "evidencia.jpg");
  form.append("upload_preset", UPLOAD_PRESET);

  const controlador = new AbortController();
  const limite = setTimeout(() => controlador.abort(), 90000);

  try {
    const respuesta = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      { method: "POST", body: form, signal: controlador.signal }
    );

    const datos = await respuesta.json();

    if (!respuesta.ok || !datos.secure_url) {
      throw new Error(
        datos.error?.message ||
        `Cloudinary rechazó la imagen (${respuesta.status}).`
      );
    }

    if (!datos.secure_url.startsWith("https://")) {
      throw new Error("Cloudinary devolvió un enlace no válido.");
    }

    return datos.secure_url;
  } catch (error) {
    if (error.name === "AbortError") {
      throw new Error("La subida tardó demasiado. Revisa tu conexión.");
    }
    throw error;
  } finally {
    clearTimeout(limite);
  }
}

$("formulario").addEventListener("submit", async evento => {
  evento.preventDefault();
  if (ocupado) return;

  if (!db) {
    mensaje("Firebase no está conectado. Revisa la carga de los SDK.", true);
    return;
  }

  const unidad = $("unidadNum").value.trim();
  const km = Number($("kmNum").value);
  const fecha = $("fechaManual").value;

  if (!/^\d+$/.test(unidad)) {
    mensaje("Ingresa un número de unidad válido.", true);
    return;
  }

  if ($("kmNum").value === "" || !Number.isSafeInteger(km) || km < 0) {
    mensaje("Ingresa un kilometraje entero válido.", true);
    return;
  }

  if (!fecha) {
    mensaje("Selecciona la fecha.", true);
    return;
  }

  // Capturar los archivos antes de iniciar la subida.
  const seleccionadas = posiciones.flatMap(([, clave, titulo]) => {
    const archivo = $("foto-" + clave).files[0];
    return archivo ? [{ clave, titulo, archivo }] : [];
  });

  if (!seleccionadas.length) {
    mensaje("Selecciona al menos una fotografía.", true);
    return;
  }

  ocupado = true;
  const controles = [...$("formulario").querySelectorAll("input,button")];
  controles.forEach(control => control.disabled = true);
  $("verFormato").hidden = true;
  $("progreso").hidden = false;
  $("progreso").value = 0;

  try {
    // Solo contendrá fotos nuevas: no se envían cadenas vacías.
    const fotos = {};

    for (let i = 0; i < seleccionadas.length; i++) {
      const item = seleccionadas[i];

      mensaje(`Procesando ${i+1}/${seleccionadas.length}: ${item.titulo}`);
      const blob = await comprimirImagen(item.archivo);
      fotos[item.clave] = await uploadCloudinary(blob);

      $("progreso").value =
        Math.round((i + 1) / seleccionadas.length * 85);
    }

    mensaje("Guardando enlaces en Firestore...");
    $("progreso").value = 95;

    await db.collection("evidencias_mantenimiento")
      .doc("EV_" + unidad)
      .set({
        unidad,
        km,
        fecha,
        timestamp: Date.now(),
        fotos
      }, { merge: true });

    $("progreso").value = 100;

    mensaje(
      `Guardado confirmado: unidad ${unidad}, ` +
      `${seleccionadas.length} fotografía(s).`
    );

    $("verFormato").href =
      "formato-manto.html?unidad=" + encodeURIComponent(unidad);
    $("verFormato").hidden = false;

    // Se limpian las selecciones; las miniaturas quedan visibles.
    seleccionadas.forEach(item => $("foto-" + item.clave).value = "");
  } catch (error) {
    console.error("Error al guardar evidencias:", error);
    mensaje(
      "No se confirmó el guardado en Firestore: " + error.message +
      "\nConserva las fotografías e intenta nuevamente.",
      true
    );
  } finally {
    ocupado = false;
    controles.forEach(control => control.disabled = false);
  }
});
</script>
</body>
</html>
